<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
      rel="stylesheet"
    />

    <title>Calendário</title>

    <script type="module" src="js/index.js"></script>

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/components/header-principal.css" />
    <link rel="stylesheet" href="css/components/conteudo-principal.css" />
    <link rel="stylesheet" href="css/components/legenda-principal.css" />
    <link rel="stylesheet" href="css/components/calendario-principal.css" />
    <link rel="stylesheet" href="css/components/mes-calendario.css" />
    <link rel="stylesheet" href="css/components/dias-semana.css" />
    <link rel="stylesheet" href="css/components/dias-calendario.css" />
    <link rel="stylesheet" href="css/components/dia-calendario.css" />
    <link rel="stylesheet" href="css/components/rodape-principal.css" />
  </head>
  <body>
    <header class="header-principal">
      <h1>Escala de Plantão</h1>

      <p>Plantão a cada 5 dias</p>
    </header>

    <main class="conteudo-principal">
      <section class="legenda-principal">
        <div class="item">
          <div class="cor -normal"></div>
          <span>Sem plantão</span>
        </div>

        <div class="item">
          <div class="cor -plantao"></div>
          <span>Plantão</span>
        </div>

        <div class="item">
          <div class="cor -hoje"></div>
          <span>Hoje</span>
        </div>
      </section>

      <section id="calendario" class="calendario-principal"></section>
    </main>

    <footer class="rodape-principal">
      <small>Desenvolvido por Lucas Efrens - Escala automática</small>
    </footer>
  </body>
</html>
